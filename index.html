<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - Expo Style</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* ===== APP CONTAINER ===== */
        .app-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            padding: 30px 24px;
            transition: all 0.3s ease;
        }
        
        /* ===== HEADER ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }
        
        .app-header h1 i {
            color: #6c5ce7;
            margin-right: 10px;
        }
        
        .task-count {
            background: #6c5ce7;
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 30px;
            letter-spacing: 0.3px;
        }
        
        /* ===== ADD TODO FORM ===== */
        .add-todo-form {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        
        .add-todo-form input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.25s ease;
            background: #fafafa;
        }
        
        .add-todo-form input:focus {
            border-color: #6c5ce7;
            background: white;
        }
        
        .add-todo-form button {
            padding: 14px 24px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        
        .add-todo-form button:hover {
            background: #5a4bd1;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
        }
        
        .add-todo-form button:active {
            transform: translateY(0);
        }
        
        /* ===== FILTER TABS ===== */
        .filter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            background: #f0f0f0;
            padding: 4px;
            border-radius: 14px;
        }
        
        .filter-tabs button {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        
        .filter-tabs button.active {
            background: white;
            color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        
        .filter-tabs button:hover:not(.active) {
            color: #1a1a1a;
        }
        
        /* ===== TODO LIST ===== */
        .todo-list {
            list-style: none;
            margin-bottom: 20px;
            min-height: 200px;
        }
        
        .todo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: #fafafa;
            border-radius: 14px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            animation: slideIn 0.3s ease;
        }
        
        .todo-item:hover {
            background: #f0edff;
            transform: translateX(4px);
        }
        
        .todo-item.completed {
            opacity: 0.6;
        }
        
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }
        
        /* Checkbox */
        .todo-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2.5px solid #d0d0d0;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        
        .todo-checkbox:hover {
            border-color: #6c5ce7;
        }
        
        .todo-item.completed .todo-checkbox {
            background: #6c5ce7;
            border-color: #6c5ce7;
        }
        
        .todo-item.completed .todo-checkbox i {
            color: white;
            font-size: 12px;
        }
        
        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #1a1a1a;
            word-break: break-word;
        }
        
        /* Delete button */
        .todo-delete {
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
            opacity: 0.4;
        }
        
        .todo-delete:hover {
            color: #e74c3c;
            background: #fee8e5;
            opacity: 1;
        }
        
        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-state i {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 16px;
        }
        
        .empty-state p {
            font-size: 16px;
            font-weight: 500;
        }
        
        /* ===== CLEAR COMPLETED ===== */
        .clear-completed-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }
        
        .clear-completed-btn {
            background: transparent;
            border: none;
            color: #999;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        
        .clear-completed-btn:hover {
            color: #e74c3c;
            background: #fee8e5;
        }
        
        /* ===== ANIMATIONS ===== */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 540px) {
            .app-container {
                padding: 20px 16px;
            }
            
            .app-header h1 {
                font-size: 22px;
            }
            
            .add-todo-form {
                flex-direction: column;
            }
            
            .add-todo-form button {
                justify-content: center;
                padding: 14px;
            }
            
            .filter-tabs button {
                font-size: 13px;
                padding: 8px 0;
            }
            
            .todo-item {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- Header -->
        <header class="app-header">
            <h1><i class="fas fa-check-circle"></i> Todo</h1>
            <span class="task-count" id="taskCount">0</span>
        </header>

        <!-- Add Todo Form -->
        <form class="add-todo-form" id="todoForm">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new task..." 
                autofocus
                required
            />
            <button type="submit">
                <i class="fas fa-plus"></i> Add
            </button>
        </form>

        <!-- Filter Tabs -->
        <div class="filter-tabs" id="filterTabs">
            <button class="active" data-filter="all">All</button>
            <button data-filter="active">Active</button>
            <button data-filter="completed">Completed</button>
        </div>

        <!-- Todo List -->
        <ul class="todo-list" id="todoList">
            <!-- Todos will be rendered here -->
        </ul>

        <!-- Clear Completed -->
        <div class="clear-completed-wrapper">
            <button class="clear-completed-btn" id="clearCompleted">
                <i class="fas fa-trash-alt"></i> Clear Completed
            </button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  STATE
            // ============================================================
            let todos = [];
            let currentFilter = 'all'; // 'all' | 'active' | 'completed'

            // ============================================================
            //  DOM REFS
            // ============================================================
            const todoListEl = document.getElementById('todoList');
            const todoForm = document.getElementById('todoForm');
            const todoInput = document.getElementById('todoInput');
            const taskCountEl = document.getElementById('taskCount');
            const filterTabs = document.getElementById('filterTabs');
            const clearCompletedBtn = document.getElementById('clearCompleted');

            // ============================================================
            //  HELPERS / UTILITY
            // ============================================================
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
            }

            // ============================================================
            //  BACKEND SIMULATION  (matches Expo app behavior)
            // ============================================================
            const Backend = {
                // Simulate async API calls with localStorage persistence
                _storageKey: 'todos_data',

                // Load todos from localStorage
                loadTodos() {
                    try {
                        const stored = localStorage.getItem(this._storageKey);
                        if (stored) {
                            todos = JSON.parse(stored);
                            // Ensure each todo has an 'id' (migrate old data)
                            todos = todos.filter(t => t && typeof t === 'object')
                                         .map(t => ({ ...t, id: t.id || generateId() }));
                        } else {
                            // Seed with sample todos (like a fresh Expo app)
                            todos = [
                                { id: generateId(), text: 'Welcome to your Todo app!', completed: false },
                                { id: generateId(), text: 'Try adding a new task', completed: false },
                                { id: generateId(), text: 'Mark me as completed', completed: true },
                            ];
                        }
                        return Promise.resolve(todos);
                    } catch (e) {
                        console.warn('Failed to load todos, starting fresh.', e);
                        todos = [];
                        return Promise.resolve(todos);
                    }
                },

                // Save todos to localStorage
                saveTodos() {
                    try {
                        localStorage.setItem(this._storageKey, JSON.stringify(todos));
                        return Promise.resolve(todos);
                    } catch (e) {
                        console.error('Failed to save todos:', e);
                        return Promise.reject(e);
                    }
                },

                // Create a new todo
                createTodo(text) {
                    const newTodo = {
                        id: generateId(),
                        text: text.trim(),
                        completed: false,
                    };
                    todos.unshift(newTodo); // add to beginning (like Expo app)
                    return this.saveTodos().then(() => newTodo);
                },

                // Toggle completion
                toggleTodo(id) {
                    const todo = todos.find(t => t.id === id);
                    if (todo) {
                        todo.completed = !todo.completed;
                        // Move completed to end (like many mobile apps)
                        if (todo.completed) {
                            const index = todos.indexOf(todo);
                            todos.splice(index, 1);
                            todos.push(todo);
                        }
                        return this.saveTodos().then(() => todo);
                    }
                    return Promise.reject(new Error('Todo not found'));
                },

                // Delete a todo
                deleteTodo(id) {
                    const index = todos.findIndex(t => t.id === id);
                    if (index !== -1) {
                        todos.splice(index, 1);
                        return this.saveTodos().then(() => true);
                    }
                    return Promise.reject(new Error('Todo not found'));
                },

                // Clear all completed
                clearCompleted() {
                    todos = todos.filter(t => !t.completed);
                    return this.saveTodos().then(() => todos);
                },

                // Get filtered todos (simulates backend filter)
                getFiltered(filter) {
                    switch (filter) {
                        case 'active':
                            return todos.filter(t => !t.completed);
                        case 'completed':
                            return todos.filter(t => t.completed);
                        default:
                            return [...todos];
                    }
                }
            };

            // ============================================================
            //  RENDER FUNCTION
            // ============================================================
            function render() {
                const filtered = Backend.getFiltered(currentFilter);
                const count = todos.filter(t => !t.completed).length;

                // Update task count
                taskCountEl.textContent = count;

                // Clear list
                todoListEl.innerHTML = '';

                if (filtered.length === 0) {
                    // Show empty state
                    const emptyLi = document.createElement('li');
                    emptyLi.className = 'empty-state';
                    emptyLi.innerHTML = `
                        <i class="fas fa-clipboard-list"></i>
                        <p>${currentFilter === 'all' ? 'No tasks yet. Add one above!' :
                           currentFilter === 'active' ? 'All tasks completed! 🎉' :
                           'No completed tasks yet.'}</p>
                    `;
                    todoListEl.appendChild(emptyLi);
                    return;
                }

                // Render each todo
                filtered.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item${todo.completed ? ' completed' : ''}`;
                    li.dataset.id = todo.id;

                    // Checkbox
                    const checkbox = document.createElement('div');
                    checkbox.className = 'todo-checkbox';
                    checkbox.setAttribute('role', 'button');
                    checkbox.setAttribute('aria-label', 'Toggle task');
                    if (todo.completed) {
                        checkbox.innerHTML = '<i class="fas fa-check"></i>';
                    }
                    checkbox.addEventListener('click', function(e) {
                        e.stopPropagation();
                        handleToggle(todo.id);
                    });

                    // Text
                    const textSpan = document.createElement('span');
                    textSpan.className = 'todo-text';
                    textSpan.textContent = todo.text;

                    // Delete button
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'todo-delete';
                    deleteBtn.setAttribute('aria-label', 'Delete task');
                    deleteBtn.innerHTML = '<i class="fas fa-times"></i>';
                    deleteBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        handleDelete(todo.id);
                    });

                    li.appendChild(checkbox);
                    li.appendChild(textSpan);
                    li.appendChild(deleteBtn);
                    todoListEl.appendChild(li);
                });
            }

            // ============================================================
            //  EVENT HANDLERS (with backend simulation)
            // ============================================================
            function handleAddTodo(text) {
                if (!text || !text.trim()) return;
                Backend.createTodo(text)
                    .then(() => {
                        render();
                        todoInput.value = '';
                        todoInput.focus();
                    })
                    .catch(err => console.error('Add failed:', err));
            }

            function handleToggle(id) {
                Backend.toggleTodo(id)
                    .then(() => render())
                    .catch(err => console.error('Toggle failed:', err));
            }

            function handleDelete(id) {
                Backend.deleteTodo(id)
                    .then(() => render())
                    .catch(err => console.error('Delete failed:', err));
            }

            function handleClearCompleted() {
                Backend.clearCompleted()
                    .then(() => render())
                    .catch(err => console.error('Clear completed failed:', err));
            }

            function handleFilterChange(filter) {
                currentFilter = filter;
                // Update active tab UI
                filterTabs.querySelectorAll('button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                render();
            }

            // ============================================================
            //  EVENT LISTENERS
            // ============================================================
            // Form submit
            todoForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const text = todoInput.value;
                handleAddTodo(text);
            });

            // Filter tabs
            filterTabs.addEventListener('click', function(e) {
                const btn = e.target.closest('button');
                if (!btn) return;
                const filter = btn.dataset.filter;
                if (filter && filter !== currentFilter) {
                    handleFilterChange(filter);
                }
            });

            // Clear completed
            clearCompletedBtn.addEventListener('click', function() {
                handleClearCompleted();
            });

            // ============================================================
            //  INITIALIZATION  (load data & render)
            // ============================================================
            Backend.loadTodos()
                .then(() => {
                    render();
                })
                .catch(err => {
                    console.error('Initial load failed:', err);
                    // Fallback: start with empty array
                    todos = [];
                    render();
                });

            // Optional: Keyboard shortcut for focus
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && e.ctrlKey === false && e.metaKey === false) {
                    const active = document.activeElement;
                    if (active && active.tagName !== 'INPUT') {
                        e.preventDefault();
                        todoInput.focus();
                    }
                }
            });

        })();
    </script>

</body>
</html>
